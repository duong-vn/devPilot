version: 2.1
jobs:
  verify:
    docker:
      - image: cimg/node:24.13
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run:
          name: Production build without external services
          command: npm run build
          environment:
            NEXT_TELEMETRY_DISABLED: "1"
workflows:
  quality:
    jobs:
      - verify
