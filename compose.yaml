services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: devpilot
      POSTGRES_DB: devpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devpilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpilot -d devpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  devpilot_postgres:
